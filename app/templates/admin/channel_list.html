{% extends 'admin/model/list.html' %}

{% block list_header %}
    {{ super() }}
    <div class="btn-group" style="margin-bottom: 10px;">
        <a href="{{ url_for('.sync_channels_view') }}" class="btn btn-success">
            <span class="glyphicon glyphicon-refresh"></span> 同步 Telegram 频道
        </a>
    </div>
{% endblock %}

{% block list_row_actions %}
    {{ super() }}
    <a class="icon" href="{{ url_for('.fetch_history_view', channel_id=row.id) }}" title="拉取历史消息">
        <span class="glyphicon glyphicon-download-alt"></span>
    </a>
{% endblock %}
