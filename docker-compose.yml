services:
#    --------------------------------------------------
#        ____      ____                              
#       /  _/___  / __/___  _________ ___  ___  _____
#       / // __ \/ /_/ __ \/ ___/ __ `__ \/ _ \/ ___/
#     _/ // / / / __/ /_/ / /  / / / / / /  __/ /    
#    /___/_/ /_/_/  \____/_/  /_/ /_/ /_/\___/_/ v1.1
#    
#    --------------------------------------------------
#    by @paulpierre Updated 2021-08-16
#    https://github.com/paulpierre/informer
#   


  # ================
  # Database Service
  # ================
  db_informer:
    env_file:
      - informer.env
    container_name: db_informer
    image: postgres:15-alpine
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
    - "5432:5432"


# =========================
# Informer Telegram Service
# =========================
  app_informer:
    env_file:
      - informer.env
    environment:
      # Override PostgreSQL host to use Docker service name instead of localhost
      - POSTGRES_HOST=db_informer
      - POSTGRES_PORT=5432
    build: .
    command: /bin/bash -c "sleep 15; python3 bot.py ${TELEGRAM_ACCOUNT_ID}"
    container_name: app_informer
    volumes:
      - ./app/:/usr/local/app
    ports:
      - "8000:8000"
    depends_on:
      - db_informer
    links:
      - db_informer

  # ===============
  # Logging service
  # ===============
  # available at http://localhost:9999
  # NOTE: this is totally optional, feel free to comment out below if prod
  app_dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 9999:8080

  # ==================
  # Flask-Admin Panel
  # ==================
  # available at http://localhost:5000
  app_admin:
    env_file:
      - informer.env
    environment:
      - POSTGRES_HOST=db_informer
      - POSTGRES_PORT=5432
    build: .
    command: /bin/bash -c "sleep 20; gunicorn -w 4 -b 0.0.0.0:5000 admin_panel:app"
    container_name: app_admin
    volumes:
      - ./app/:/usr/local/app
    ports:
      - "5000:5000"
    depends_on:
      - db_informer
    links:
      - db_informer

volumes:
  db_data: {}
